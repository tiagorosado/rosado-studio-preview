name: Publish sanitized preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public-only files
        shell: bash
        run: |
          set -eu
          test -f index.html
          test -f robots.txt
          test -f js/ambient-light.js
          test -f js/touch-preview.js
          test -f js/palette-memory.js
          node --check js/palette-memory.js
          node --check js/ambient-light.js
          node --check js/touch-preview.js
          test -f style.css
          grep -q 'noindex,nofollow' index.html
          grep -q 'light-variation' index.html
          grep -q 'js/palette-memory.js' index.html
          grep -q '/rosado-studio-preview/' index.html
          for i in 01 02 03 04 05 06; do
            test -f "work/study-$i/index.html"
            grep -q 'noindex,nofollow' "work/study-$i/index.html"
            grep -q 'light-variation' "work/study-$i/index.html"
            grep -q 'case-chapter-grid' "work/study-$i/index.html"
            grep -q 'case-next' "work/study-$i/index.html"
            grep -q 'case-fact-grid' "work/study-$i/index.html"
          done
          ! grep -iEql 'Diageo|Johnnie Walker|Blue Label|Mercedes-AMG|Balenciaga|Christian Dior' -- *.html work/study-*/index.html
          ! grep -iEq 'Diageo|Johnnie Walker|Blue Label|Mercedes-AMG|Balenciaga|Christian Dior' index.html
          ! find . -type f \( -iname '*.webp' -o -iname '*.jpg' -o -iname '*.png' \) | grep -q .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
